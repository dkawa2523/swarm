# Bounded input-configuration example; not full operating-range qualification.
schema_version: 2
run:
  solvers:
  - id: two_term
  e_over_n_Td:
  - 1.0
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  - 20.0
  - 30.0
  - 50.0
  - 100.0
  - 300.0
  case_prefix: argon_gec_icp_two_term__configured_example_bounded
conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 2.66644
  gas_mixture:
  - species: Ar
    fraction: 1.0
    mass_amu: 39.948
cross_sections:
  format: csv
  high_energy_extrapolation: zero
  files:
  - path: ../../examples/cross_sections/argon_application_library.csv
    species: Ar
    format: csv
physics:
  angular_scattering:
    model: isotropic
  ionization:
    energy_sharing: equal
  energy_grid_policy:
    tail_probability_target: 1.0e-09
    max_eV_limit: 5000.0
feature_policy:
  unsupported: fail
  degraded: record
output:
  directory: ../../outputs/configured_models/gec_icp/cases
  base_name: argon_gec_icp_two_term
campaign:
  database: ../../outputs/configured_models/gec_icp/swarm_bounded.sqlite
  quality:
    mobility_rse: 0.2
    diffusion_rse: 0.3
    major_rate_rse: 0.5
