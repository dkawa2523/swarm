schema_version: 2
model:
  input_mph: ../../Model/positive_column_1d.mph
  output_mph: ../../outputs/configured_models/positive_column/solved.mph
  study: std1
  component: comp1
  physics: plas
bundle:
  path: bundle
  source: two_term
physical_context:
  gas_temperature_K: 293.15
  gas_mixture:
  - species: Ar
    fraction: 1.0
    mass_amu: 39.948
logs:
  path: ../../outputs/configured_models/positive_column/logs
verify:
  output_path: ../../outputs/configured_models/positive_column/verify
  relative_tolerance: 1.0e-06
  absolute_tolerance: 1.0e-12
functions:
  mean_energy:
    tag: sw_meanE
    file: comsol_functions/sw_meanE.csv
    column: mean_energy_eV
    nargs: 1
    argunit: V*m^2
    fununit: eV
    interp: linear
    extrap: const
  mobility:
    tag: sw_muN
    file: comsol_functions/sw_muN.csv
    column: reduced_mobility_m2_V_s_m3
    nargs: 1
    argunit: V*m^2
    fununit: 1/(V*m*s)
    interp: linear
    extrap: const
closure:
  physics: plas
  feature: pes1
  mean_energy_formulation:
    mode: local_energy
    property_group: ElectronProperties
    property: MeanElectronEnergyModel
    comsol_value: LocalEnergyApproximationE
  mean_energy:
    table: mean_energy_vs_en.csv
    x_column: E_over_N_Td
    y_column: mean_energy_eV
reaction_lookups:
  excitation:
    physics: plas
    feature: eir2
    form: townsend
    source_model: townsend_flux
    table: rates_vs_mean_energy.csv
    argument: mean_energy_eV
    x_column: mean_energy_eV
    y_column: reduced_townsend_m2
    process_type: excitation
    species: Ar
    process: e+Ar=>e+Ars
    threshold_eV: 11.5
  ionization:
    physics: plas
    feature: eir4
    form: townsend
    source_model: townsend_flux
    table: rates_vs_mean_energy.csv
    argument: mean_energy_eV
    x_column: mean_energy_eV
    y_column: reduced_townsend_m2
    process_type: ionization
    species: Ar
    process: e+Ar=>2e+Ar+
    threshold_eV: 15.8
run:
  voltage_parameter: V0
  voltage_feature: mct1
  voltage_property: V0
  voltages_V:
  - 20
  - 50
  - 100
  - 200
results:
  output_directory: ../../outputs/configured_models/positive_column/results
  dataset: dset1
  solutions: last
  fields:
  - name: x
    expression: x
    unit: m
  - name: electron_density
    expression: plas.ne
    unit: 1/m^3
  - name: mean_electron_energy
    expression: plas.ebar/1[V/eV]
    unit: eV
  - name: electric_potential
    expression: V
    unit: V
  - name: electron_current_density
    expression: plas.Jelx
    unit: A/m^2
  - name: ion_current_density
    expression: plas.Jix_wAr_1p
    unit: A/m^2
  - name: total_current_density
    expression: plas.Jix_wAr_1p+plas.Jelx
    unit: A/m^2
  - name: excitation_source
    expression: root.comp1.plas.eir2.alpha(plas.ebar)*plas.Nn*abs(plas.Jelx)/e_const
    unit: 1/(m^3*s)
  - name: ionization_source
    expression: root.comp1.plas.eir4.alpha(plas.ebar)*plas.Nn*abs(plas.Jelx)/e_const
    unit: 1/(m^3*s)
  - name: E_over_N
    expression: plas.Erd
    unit: V*m^2
  - name: reduced_mobility
    expression: plas.muexx*plas.Nn
    unit: 1/(V*m*s)
  - name: reduced_diffusion_L
    expression: plas.Dexx*plas.Nn
    unit: 1/(m*s)
  - name: excitation_townsend
    expression: root.comp1.plas.eir2.alpha(plas.ebar)
    unit: m^2
  - name: ionization_townsend
    expression: root.comp1.plas.eir4.alpha(plas.ebar)
    unit: m^2
  - name: applied_voltage
    expression: V0
    unit: V
  - name: gas_pressure
    expression: p0
    unit: Pa
