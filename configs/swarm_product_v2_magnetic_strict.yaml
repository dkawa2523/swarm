schema_version: 2

run:
  solvers:
    - id: two_term
    - id: multi_term
  e_over_n_Td: [100]
  case_prefix: magnetic_strict

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: csv
  files:
    - path: ../examples/cross_sections/argon_minimal.csv
      species: Ar
      format: csv
  high_energy_extrapolation: error

physics:
  field:
    type: dc
    magnetic_field:
      enabled: true
      B_T: 0.05
      angle_EB_deg: 90.0
  angular_scattering:
    model: isotropic
    higher_moment_closure: zero
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: equal
    secondary_electron_energy_eV: 0.0
  energy_grid_policy:
    adaptive: true
    threshold_refinement: false
    tail_probability_target: 1.0e-8
    tail_rate_fraction_target: 1.0e-3
    tail_metrics: true
    tail_threshold_eV: null
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 1000.0
  finite_k:
    enabled: false
    k_m_inv: null

solvers:
  two_term:
    backend: native_sg
  multi_term:
    formulation: PN
    method: pn_closure_surrogate
    lmax: 4
comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: fail

output:
  directory: outputs
  base_name: magnetic_strict
