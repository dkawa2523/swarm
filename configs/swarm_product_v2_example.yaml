schema_version: 2

run:
  solvers:
    - id: two_term
    - id: multi_term
  e_over_n_Td: [10, 30, 50, 100, 200]
  case_prefix: Ar_product_demo

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: csv
  files:
    - path: ../examples/cross_sections/argon_minimal.csv
      species: Ar
      format: csv
  high_energy_extrapolation: zero

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0

  angular_scattering:
    model: momentum_power
    higher_moment_closure: power

  electron_electron:
    enabled: false
    model: none
    relaxation_fraction: 0.05
    conserve_mean_energy: true

  ionization:
    energy_sharing: equal
    secondary_electron_energy_eV: 0.0

  energy_grid_policy:
    adaptive: true
    threshold_refinement: true
    tail_probability_target: 1.0e-8
    tail_rate_fraction_target: 1.0e-3
    tail_metrics: true
    tail_threshold_eV: null
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 2000.0

  finite_k:
    enabled: false
    k_m_inv: null

solvers:
  two_term:
    backend: native_sg
    min_momentum_cross_section_m2: 1.0e-24
    nonconservative_model: growth

  multi_term:
    formulation: PN
    method: pn_closure_surrogate
    lmax: 4
    dense_threshold: 280
    lmax_convergence_tolerance: 0.03
    field_coupling_scale: 1.0

comparison:
  enabled: true
  reference_solver: two_term
  candidate_solvers: [multi_term]
  compare_eedf: true
  required: false

feature_policy:
  unsupported: fail
  degraded: warn

output:
  directory: outputs
  base_name: swarm_product_demo
  float_format: "%.10e"
