run:
  mode: both
  e_over_n_Td: [50, 100, 200]
  case_prefix: Ar

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 1000000.0
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: txt
  files:
    - path: ../../cross_sections/Ar_Biagi.txt
      species: Ar
      format: txt

monte_carlo:
  enabled: true
  python_api: "swarm_mc.unified_adapter:run_swarm"
  passthrough:
    base_config:
      initial_state:
        num_e_initial: 1e4
        initial_pos_electrons: [0.0, 0.0, 0.0]
        initial_std_electrons: [0.0, 0.0, 0.0]
      simulation_settings:
        num_energy_bins: 768
        energy_sharing_factor: 0.5
        isotropic_scattering: false
        use_aniso_scatter_lut: true
        conserve: false
        num_e_max: 1e6
        seed: run_id
      end_conditions:
        w_tol: 0.05
        DN_tol: 0.05
        num_col_max: 8e4
      output:
        save_simulation_pickle: false
        save_temporal_evolution: false
        save_swarm_parameters: false
        save_energy_distribution: false
        output_format: csv

boltzmann_two_term:
  enabled: true
  backend: native_bolsig
  energy_grid:
    min_eV: 0.0001
    max_eV: 80.0
    n: 500
    spacing: quadratic
  adaptive_grid:
    enabled: true
    max_cycles: 4
    mean_energy_multiplier: 15.0
    min_max_eV: 20.0
    max_max_eV: 1000.0
    tail_probability: 1.0e-8
    edge_to_peak: 1.0e-10
  convergence:
    max_iterations: 120
    tolerance: 1.0e-8
    eigenvalue_tolerance: 1.0e-8
    residual_tolerance: 1.0e-7
    relaxation: 0.7
  initial_electron_temperature_eV: 2.0
  nonconservative_model: growth
  ionization_energy_sharing: equal
  min_momentum_cross_section_m2: 1.0e-24

output:
  directory: ../../outputs/unified/argon_both
  base_name: argon
  write_plots: true
  write_eedf: true
  write_rates: true
  compatibility:
    write_legacy_tables: true
    primary_solver: monte_carlo
