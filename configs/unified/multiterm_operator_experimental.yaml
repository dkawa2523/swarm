run:
  mode: multiterm_boltzmann
  e_over_n_Td: [50]
  case_prefix: Ar_OPX

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 100.0
  length_scale_m: 0.05
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: txt
  high_energy_extrapolation: zero
  files:
    - path: ../../cross_sections/Ar_Biagi.txt
      species: Ar
      format: txt

multiterm_boltzmann:
  enabled: true
  lmax: 2
  method: operator
  allow_experimental_operator: true
  hydrodynamic: false
  eedf_shape: maxwellian
  energy_grid:
    min_eV: 0.001
    max_eV: 60.0
    n: 80
    spacing: log_linear
    linear_until_eV: 2.0

output:
  directory: ../../outputs/unified/argon_operator_experimental
  base_name: argon_operator_experimental
  write_plots: true
  write_eedf: true
  write_rates: true
  compatibility:
    write_legacy_tables: true
    primary_solver: multiterm_boltzmann
