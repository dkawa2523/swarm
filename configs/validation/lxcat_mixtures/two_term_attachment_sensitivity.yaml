schema_version: 2

run:
  solvers:
    - id: two_term
  e_over_n_Td: [1.0, 10.0, 100.0, 1000.0]
  case_prefix: lxcat_attachment_two_term

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - {species: Ar, fraction: 0.9, mass_amu: 39.948}
    - {species: O2, fraction: 0.1, mass_amu: 31.998}
    - {species: N2, fraction: 0.0, mass_amu: 28.0134}
    - {species: Cl2, fraction: 0.0, mass_amu: 70.906}

cross_sections:
  format: lxcat
  high_energy_extrapolation: zero
  files:
    - path: ../../../outputs/lxcat_swarm_validation/raw_lxcat/Ar_Biagi_20260914.txt
      species: Ar
      format: lxcat
    - path: ../../../outputs/lxcat_swarm_validation/raw_lxcat/O2_Biagi_binary_with_DA_20260914.txt
      species: O2
      format: lxcat
    - path: ../../../outputs/lxcat_swarm_validation/raw_lxcat/N2_Biagi_20260914.txt
      species: N2
      format: lxcat
    - path: ../../../outputs/lxcat_swarm_validation/raw_lxcat/Cl2_MuroranIT_20260914.txt
      species: Cl2
      format: lxcat

physics:
  field:
    type: dc
    magnetic_field: {enabled: false, B_T: 0.0, angle_EB_deg: 0.0}
  angular_scattering: {model: isotropic, higher_moment_closure: zero}
  electron_electron: {enabled: false, model: none}
  ionization: {energy_sharing: equal}
  energy_grid_policy:
    adaptive: true
    threshold_refinement: false
    tail_probability_target: 1.0e-9
    tail_metrics: true
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 2000.0

solvers:
  two_term:
    backend: native_sg
    nonconservative_model: growth

comparison: {enabled: false}
feature_policy: {unsupported: fail, degraded: record}
output:
  directory: ../../../outputs/lxcat_swarm_validation/cases/two_term_attachment
  base_name: lxcat_attachment_two_term
