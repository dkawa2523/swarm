schema_version: 2

run:
  solvers:
    - id: two_term
    - id: multi_term
  e_over_n_Td: [30, 100]
  case_prefix: bench_ar

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: ../../examples/cross_sections/argon_minimal.csv
      species: Ar

physics:
  angular_scattering:
    model: momentum_power

solvers:
  multi_term:
    method: pn_closure_direct
    lmax: 4

comparison:
  enabled: true
  reference_solver: two_term
  candidate_solvers: [multi_term]
  compare_eedf: true
  required: false

output:
  directory: ../../outputs/benchmarks
  base_name: ar_simple
