schema_version: 2

run:
  solvers:
    - id: two_term
    - id: multi_term
  e_over_n_Td: [1, 3, 10, 30, 50, 100, 300, 500]
  case_prefix: ar_bolsig_equiv

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 100.0
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  high_energy_extrapolation: error
  files:
    - path: ../../examples/cross_sections/argon_minimal.csv
      species: Ar

physics:
  energy_grid_policy:
    max_eV_limit: 100.0

solvers:
  multi_term:
    method: pn_closure_direct
    lmax: 1

references:
  external:
    - id: bolsig_plus
      path: ../../data/references/ar_bolsig_plus_equivalence.csv
      format: electron_swarm_reference_csv
      eedf_convention: eedf

output:
  directory: ../../outputs/benchmarks
  base_name: ar_bolsig_plus_equivalence
