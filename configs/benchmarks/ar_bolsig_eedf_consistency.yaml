schema_version: 2

run:
  solvers:
    - id: two_term
    - id: multi_term
    - id: monte_carlo
  e_over_n_Td: [50]
  case_prefix: ar_eedf

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 100.0
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: ../../examples/cross_sections/argon_minimal.csv
      species: Ar

physics:
  energy_grid_policy:
    threshold_refinement: false
    max_eV_limit: 1000.0

solvers:
  multi_term:
    method: pn_closure_direct
    lmax: 4
  monte_carlo:
    particles: 128
    max_collisions: 256
    seed: 41

comparison:
  enabled: true
  reference_solver: two_term
  candidate_solvers: [multi_term, monte_carlo]
  compare_eedf: true
  required: false

output:
  directory: ../../outputs/benchmarks
  base_name: ar_eedf_consistency
