schema_version: 2

run:
  solvers:
    - id: monte_carlo
  e_over_n_Td: [50]
  case_prefix: bench_mc

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: ../../examples/cross_sections/argon_minimal.csv
      species: Ar

solvers:
  monte_carlo:
    particles: 32
    max_collisions: 12
    seed: 123

output:
  directory: ../../outputs/benchmarks
  base_name: mc_internal_optional
