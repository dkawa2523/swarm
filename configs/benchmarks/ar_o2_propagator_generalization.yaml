schema_version: 2

run:
  solvers:
    - id: propagator
  # Numerical generalization matrix only.  The compact teaching cross-section
  # set is not an external physical-accuracy reference.
  e_over_n_Td: [100.0]
  case_prefix: ar_o2_propagator_generalization

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 0.9
      mass_amu: 39.948
    - species: O2
      fraction: 0.1
      mass_amu: 31.998

cross_sections:
  format: csv
  high_energy_extrapolation: hold
  files:
    - path: ../../examples/cross_sections/ar_o2_minimal.csv
      format: csv

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0
  angular_scattering:
    model: isotropic
    higher_moment_closure: zero
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: primary_secondary
    secondary_electron_energy_eV: 0.5
  energy_grid_policy:
    adaptive: true
    threshold_refinement: true
    tail_probability_target: 1.0e-9
    tail_metrics: true
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 30000.0

solvers:
  propagator:
    method: stationary_response
    energy_cells: 64
    # 8/16 directions are intentionally not treated as a converged mixture
    # result; the paired qualification repeats this case at 72 directions.
    polar_cells: 36
    max_iterations: 2000
    convergence_tolerance: 1.0e-8
    max_memory_mb: 512

comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: record

output:
  directory: ../../outputs/benchmarks/ar_o2_propagator_generalization
  base_name: ar_o2_propagator_generalization
