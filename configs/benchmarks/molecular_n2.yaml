schema_version: 2

run:
  solvers:
    - id: two_term
  e_over_n_Td: [100]
  case_prefix: bench_n2

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: N2
      fraction: 1.0
      mass_amu: 28.0134

cross_sections:
  format: txt
  files:
    - path: ../../cross_sections/N2_Biagi.txt
      species: N2

output:
  directory: ../../outputs/benchmarks
  base_name: molecular_n2
