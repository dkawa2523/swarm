schema_version: 2

run:
  solvers:
    - id: two_term
  e_over_n_Td: [100]
  case_prefix: bench_n2

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: N2
      fraction: 1.0
      mass_amu: 28.0134

cross_sections:
  format: txt
  files:
    - path: ../../cross_sections/N2_Biagi.txt
      species: N2
      format: txt
  high_energy_extrapolation: zero

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0
  angular_scattering:
    model: isotropic
    higher_moment_closure: zero
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: equal
    secondary_electron_energy_eV: 0.0
  energy_grid_policy:
    adaptive: true
    threshold_refinement: true
    tail_metrics: true
    tail_threshold_eV: null
    tail_rate_warning_fraction: 0.05
  finite_k:
    enabled: false
    k_m_inv: null

solvers:
  two_term:
    backend: native_sg

comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: warn

output:
  directory: ../../outputs/benchmarks
  base_name: molecular_n2
