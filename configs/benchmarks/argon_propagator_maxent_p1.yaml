schema_version: 2

run:
  solvers:
    - id: propagator
  # Elastic-only angular-core qualification.  At higher E/N this model has no
  # inelastic stopping and is intentionally left to the energy-boundary gate.
  e_over_n_Td: [0.05, 0.1, 1.0]
  case_prefix: argon_propagator_maxent_p1

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3322
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: csv
  high_energy_extrapolation: error
  files:
    - path: ../../examples/cross_sections/argon_magboltz_11_17_gas2_elastic.csv
      species: Ar
      format: csv

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0
  angular_scattering:
    model: maxent_p1
    higher_moment_closure: maxent
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: equal
  energy_grid_policy:
    adaptive: true
    threshold_refinement: true
    tail_probability_target: 1.0e-9
    tail_metrics: true
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 30000.0

solvers:
  propagator:
    method: stationary_response
    energy_cells: 64
    polar_cells: 8
    max_iterations: 2000
    convergence_tolerance: 1.0e-8
    max_memory_mb: 512

comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: record

output:
  directory: ../../outputs/benchmarks/argon_propagator_maxent_p1
  base_name: argon_propagator_maxent_p1
