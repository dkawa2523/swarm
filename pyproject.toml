[project]
name = "electron-swarm"
version = "0.2.0"
description = "Electron swarm solver comparison tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "lxcat_data_parser",
]

[project.scripts]
electron-swarm = "electron_swarm.runner:main"

[project.optional-dependencies]
dev = ["pytest"]
plot = ["matplotlib"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["electron_swarm*"]

[tool.pytest.ini_options]
markers = [
  "slow: tests that are too heavy for the default CI path",
  "mc: Monte Carlo backend or stochastic integration tests",
  "regression: lightweight numerical regression checks",
]
