schema_version: 2

run:
  solvers:
    - id: multi_term
  e_over_n_Td: [50]
  case_prefix: ex_multi_term_direct

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: cross_sections/argon_minimal.csv
      species: Ar

solvers:
  multi_term:
    method: pn_closure_direct
    lmax: 4

output:
  directory: ../outputs/examples
  base_name: multi_term_direct_lmax4
