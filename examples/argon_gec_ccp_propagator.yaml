schema_version: 2

# Target-specific bounded P1 source for the GEC-CCP restricted local-mean-
# energy closure.  The 300 x 48 profile is the target production grid.  The
# angular increase from 36 to 48 is required by an independent 4000 Td split-
# grid check; 300 x 48 agrees with 600 x 72 within the declared 1% scalar and
# 2% EEDF-L1 refinement gates without the cost of a 72-cell production grid.
run:
  solvers:
    - id: propagator
  e_over_n_Td: [10.0, 100.0]
  case_prefix: argon_gec_ccp_propagator

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3322
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: csv
  high_energy_extrapolation: zero
  files:
    - path: cross_sections/argon_application_library.csv
      species: Ar
      format: csv

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0
  angular_scattering:
    model: isotropic
    higher_moment_closure: zero
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: equal
  energy_grid_policy:
    adaptive: true
    threshold_refinement: true
    tail_probability_target: 1.0e-9
    tail_metrics: true
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 30000.0

solvers:
  propagator:
    method: stationary_response
    energy_cells: 300
    polar_cells: 48
    max_iterations: 2000
    convergence_tolerance: 1.0e-8
    # The 300 x 48 operator peaks below 100 MiB on the qualification host.
    # Keep a conservative hard ceiling without reserving a full GiB per anchor.
    max_memory_mb: 256

comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: record

output:
  directory: ../outputs/argon_gec_ccp/propagator_gec_ccp_cases
  base_name: argon_gec_ccp_propagator
