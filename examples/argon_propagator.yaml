schema_version: 2

run:
  solvers:
    - id: propagator
  # Propagator is an independently qualified bounded P1 calculation model.
  # These anchors converge within 2000 response applications.
  e_over_n_Td: [10.0, 100.0]
  case_prefix: argon_propagator

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3322
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: csv
  high_energy_extrapolation: zero
  files:
    - path: cross_sections/argon_application_library.csv
      species: Ar
      format: csv

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0
  angular_scattering:
    model: isotropic
    higher_moment_closure: zero
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: equal
  energy_grid_policy:
    adaptive: true
    threshold_refinement: true
    tail_probability_target: 1.0e-9
    tail_metrics: true
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 30000.0

solvers:
  propagator:
    method: stationary_response
    energy_cells: 600
    polar_cells: 72
    max_iterations: 2000
    convergence_tolerance: 1.0e-8
    max_memory_mb: 1024

comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: record

output:
  directory: ../outputs/argon_gec_ccp/propagator_cases
  base_name: argon_propagator
