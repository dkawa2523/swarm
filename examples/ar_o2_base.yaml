schema_version: 2

run:
  solvers:
    - id: two_term
  e_over_n_Td: [50.0]
  case_prefix: ex_ar_o2

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 0.99
      mass_amu: 39.948
    - species: O2
      fraction: 0.01
      mass_amu: 31.998

cross_sections:
  format: csv
  high_energy_extrapolation: zero
  files:
    - path: cross_sections/ar_o2_minimal.csv
      format: csv

physics:
  field:
    type: dc
    magnetic_field:
      enabled: false
      B_T: 0.0
      angle_EB_deg: 0.0
  angular_scattering:
    model: isotropic
    higher_moment_closure: zero
  electron_electron:
    enabled: false
    model: none
  ionization:
    energy_sharing: equal
  energy_grid_policy:
    adaptive: true
    threshold_refinement: false
    tail_probability_target: 1.0e-8
    tail_metrics: true
    tail_rate_warning_fraction: 0.05
    max_eV_limit: 1000.0

solvers:
  two_term:
    backend: native_sg

comparison:
  enabled: false

feature_policy:
  unsupported: fail
  degraded: record

output:
  directory: ../outputs/examples
  base_name: ar_o2
