schema_version: 2

run:
  solvers:
    - id: two_term
  e_over_n_Td: [50]
  case_prefix: ex_two_term

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: cross_sections/argon_minimal.csv
      species: Ar

physics:
  energy_grid_policy:
    threshold_refinement: false

output:
  directory: ../outputs/examples
  base_name: two_term
