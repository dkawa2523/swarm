# Fourteen independently reproducible mean-energy-support anchors are computed
# in this campaign. The 1 Td row adds a field-parity transport leg while
# retaining the complete positive-field EEDF/rate budget, and the extended
# 5 Td row resolves its distribution-stationarity window. The conditional-tail
# upper bound is 9,990,832,128 nominal particle barriers, with at most
# 545,259,520 per replica.
# Materialize this source with the function_eedf_restricted_lmea MC
# qualification profile; that table-build choice is not a workflow field.
base_config: argon_gec_icp_monte_carlo_weighted_branching.yaml
database: ../outputs/argon_gec_icp/monte_carlo_function_eedf.sqlite
