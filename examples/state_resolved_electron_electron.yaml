run:
  mode: boltzmann_two_term
  e_over_n_Td: [50]
  case_prefix: Ar_ext

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 100.0
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  format: csv
  high_energy_extrapolation: zero
  files:
    - path: cross_sections/argon_minimal.csv
      species: Ar
      format: csv

boltzmann_two_term:
  enabled: true
  backend: native_bolsig
  energy_grid:
    min_eV: 0.0001
    max_eV: 50.0
    n: 160
    spacing: quadratic
    refine:
      enabled: true
      threshold_padding_eV: 0.15
      points_per_threshold: 8
  adaptive_grid:
    enabled: false

multiterm_boltzmann:
  enabled: false
  method: moment_closure
  lmax: 3
  energy_grid:
    min_eV: 0.001
    max_eV: 60.0
    n: 120
    spacing: log_linear
    linear_until_eV: 2.0
    refine:
      enabled: true

monte_carlo:
  enabled: false

species_states:
  Ar:
    ground:
      energy_eV: 0.0
      population: 1.0
    Ar_4s:
      energy_eV: 11.55
      population: 1.0e-4
      degeneracy: 3

state_resolved:
  enabled: true
  generate_superelastic: true
  detailed_balance: simple
  superelastic_energy_floor_eV: 0.1
  transitions:
    - species: Ar
      process: excitation
      initial_state: ground
      final_state: Ar_4s

molecular_states:
  N2:
    vibrational:
      levels:
        - name: v0
          energy_eV: 0.0
          population: 1.0
        - name: v1
          energy_eV: 0.29
          population: 0.05

electron_electron:
  enabled: true
  model: relaxation
  relaxation_fraction: 0.05
  conserve_mean_energy: true

output:
  directory: ../outputs/examples/ar_extensions
  base_name: ar_extensions
  write_plots: false
  compatibility:
    write_legacy_tables: true
    primary_solver: boltzmann_two_term
