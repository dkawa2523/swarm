schema_version: 2
run:
  solvers:
  - id: propagator
  e_over_n_Td:
  - 1.0
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  - 20.0
  - 30.0
  - 50.0
  - 100.0
  - 300.0
  - 1000.0
  - 1500.0
  - 2500.0
  - 2744.2936035
  case_prefix: argon_gec_icp_propagator
conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 2.66644
  gas_mixture:
  - species: Ar
    fraction: 1.0
    mass_amu: 39.948
cross_sections:
  format: csv
  high_energy_extrapolation: zero
  files:
  - path: cross_sections/argon_application_library.csv
    species: Ar
    format: csv
physics:
  angular_scattering:
    model: isotropic
  ionization:
    energy_sharing: equal
  energy_grid_policy:
    tail_probability_target: 1.0e-09
    max_eV_limit: 5000.0
solvers:
  propagator:
    method: stationary_response
    energy_cells: 300
    polar_cells: 48
    max_iterations: 2000
    convergence_tolerance: 1.0e-08
    max_memory_mb: 256
feature_policy:
  unsupported: fail
  degraded: record
output:
  directory: ../outputs/argon_gec_icp/propagator_cases
  base_name: argon_gec_icp_propagator
campaign:
  database: ../outputs/argon_gec_icp/propagator_function_eedf_mean_energy_guarded.sqlite
  quality:
    mobility_rse: 0.2
    diffusion_rse: 0.3
    major_rate_rse: 0.5
  execution:
    deterministic:
      workers: 4
      global_memory_budget_mb: 2048
