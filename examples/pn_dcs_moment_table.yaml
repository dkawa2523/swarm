schema_version: 2

run:
  solvers:
    - id: multi_term
  e_over_n_Td: [50]
  case_prefix: ex_pn_dcs

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: cross_sections/argon_minimal.csv
      species: Ar

physics:
  angular_scattering:
    model: moment_table
    moment_table:
      path: moment_tables/argon_demo_moments.csv
      provenance: model_derived

solvers:
  multi_term:
    method: pn_dcs
    lmax: 3

output:
  directory: ../outputs/examples
  base_name: pn_dcs_moment_table
