base_config: argon_gec_ccp_propagator.yaml
# Use the same offline E/N anchor contract as the two-term Function-EEDF
# target.  COMSOL consumes these tables in one 1 W study; this is not a COMSOL
# coefficient or power sweep.  P0/P1 is independently qualified; the separate
# target qualification and COMSOL acceptance decide physical-target release.
