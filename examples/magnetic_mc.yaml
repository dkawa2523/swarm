schema_version: 2

run:
  solvers:
    - id: monte_carlo
  e_over_n_Td: [50]
  case_prefix: ex_magnetic_mc

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: cross_sections/argon_minimal.csv
      species: Ar

physics:
  field:
    magnetic_field:
      enabled: true
      B_T: 0.01
      angle_EB_deg: 90.0

solvers:
  monte_carlo:
    particles: 32
    max_collisions: 12
    seed: 11

output:
  directory: ../outputs/examples
  base_name: magnetic_mc
