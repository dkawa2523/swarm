schema_version: 2

run:
  solvers:
    - id: two_term
    - id: multi_term
    - id: monte_carlo
  e_over_n_Td: [50]
  case_prefix: ex_compare

conditions:
  gas_temperature_K: 300.0
  pressure_Pa: 13.3
  gas_mixture:
    - species: Ar
      fraction: 1.0
      mass_amu: 39.948

cross_sections:
  files:
    - path: cross_sections/argon_minimal.csv
      species: Ar

solvers:
  multi_term:
    method: pn_closure_direct
    lmax: 4
  monte_carlo:
    particles: 32
    max_collisions: 12
    seed: 7

comparison:
  enabled: true
  reference_solver: two_term
  candidate_solvers: [multi_term, monte_carlo]
  compare_eedf: true
  required: false

output:
  directory: ../outputs/examples
  base_name: compare_three_solvers
